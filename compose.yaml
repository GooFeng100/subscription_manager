services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8084}
    image: subscription-manager-web:latest
    container_name: subscription-manager-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - gateway_net
      - subscription_internal

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: subscription-manager-app:latest
    container_name: subscription-manager-app
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8084}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/subscription_manager}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CONVERTER_BACKEND_URL: ${CONVERTER_BACKEND_URL:-http://subconverter:25500/sub}
      SESSION_COOKIE_SECURE: "false"
      NODE_OPTIONS: --max-old-space-size=192
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sm_session}
      SESSION_SECRET: ${SESSION_SECRET:-please-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-please-change-me}
      CONVERTER_SOURCE_SECRET: ${CONVERTER_SOURCE_SECRET:-change-me-internal-source-secret}
      LOGIN_FAIL_LIMIT: ${LOGIN_FAIL_LIMIT:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      REGISTER_IP_LIMIT: ${REGISTER_IP_LIMIT:-10}
      REGISTER_IP_WINDOW_MINUTES: ${REGISTER_IP_WINDOW_MINUTES:-60}
      SUB_RATE_LIMIT_PER_MINUTE: ${SUB_RATE_LIMIT_PER_MINUTE:-60}
      UPSTREAM_POLL_INTERVAL_MINUTES: ${UPSTREAM_POLL_INTERVAL_MINUTES:-60}
      SUB_CONVERTER_TIMEOUT_MS: ${SUB_CONVERTER_TIMEOUT_MS:-10000}
      UPSTREAM_FETCH_PROXY_URL: ${UPSTREAM_FETCH_PROXY_URL:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      REGISTER_ENABLED: ${REGISTER_ENABLED:-false}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      LOGIN_TURNSTILE_ENABLED: ${LOGIN_TURNSTILE_ENABLED:-false}
      REGISTER_TURNSTILE_ENABLED: ${REGISTER_TURNSTILE_ENABLED:-false}
      REDEEM_TURNSTILE_ENABLED: ${REDEEM_TURNSTILE_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
    expose:
      - "3000"
    depends_on:
      - subconverter
    networks:
      - gateway_net
      - data_net
      - subscription_internal

  subconverter:
    image: tindy2013/subconverter:latest
    container_name: subscription-manager-subconverter
    restart: unless-stopped
    expose:
      - "25500"
    networks:
      - subscription_internal

networks:
  subscription_internal: {}
  gateway_net:
    external: true
  data_net:
    external: true
