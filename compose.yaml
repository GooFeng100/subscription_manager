services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: subscription-manager-app:latest
    container_name: subscription-manager-app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://192.168.10.3:8084}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/subscription_manager}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-before-start}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sm_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LOGIN_FAIL_LIMIT: ${LOGIN_FAIL_LIMIT:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      REGISTER_IP_LIMIT: ${REGISTER_IP_LIMIT:-10}
      REGISTER_IP_WINDOW_MINUTES: ${REGISTER_IP_WINDOW_MINUTES:-60}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      LOGIN_TURNSTILE_ENABLED: ${LOGIN_TURNSTILE_ENABLED:-true}
      REGISTER_TURNSTILE_ENABLED: ${REGISTER_TURNSTILE_ENABLED:-true}
      REDEEM_TURNSTILE_ENABLED: ${REDEEM_TURNSTILE_ENABLED:-true}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CONVERTER_BACKEND_URL: ${CONVERTER_BACKEND_URL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - subscription-manager

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_BASE_URL: ${APP_BASE_URL:-http://192.168.10.3:8084}
    image: subscription-manager-web:latest
    container_name: subscription-manager-web
    restart: unless-stopped
    networks:
      - subscription-manager

  caddy:
    image: caddy:2-alpine
    container_name: subscription-manager-caddy
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8084:80"
    depends_on:
      - app
      - web
    networks:
      - subscription-manager

  mongodb:
    image: mongo:7
    container_name: subscription-manager-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - subscription-manager

  redis:
    image: redis:7-alpine
    container_name: subscription-manager-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - subscription-manager

volumes:
  mongodb_data:
  redis_data:

networks:
  subscription-manager:
    driver: bridge
